name: Bot Pilkarski Auto-Runner

on:
  schedule:
    # Uruchamia się automatycznie co 15 minut
    - cron: '*/15 * * * *'
  workflow_dispatch: # Pozwala uruchomić bota ręcznie przyciskiem

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Uruchom bota
        run: python main.py
