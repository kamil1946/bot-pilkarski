name: Bot Pilkarski Auto-Runner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Zainstaluj biblioteki (Pillow, Tweepy)
        run: pip install pillow tweepy

      - name: Uruchom bota
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python main.py

      - name: Zapisz historię wysłanych linków
        run: |
          git config user.name "PitchZone Bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent_news.txt
          git diff --staged --quiet || (git commit -m "Aktualizacja historii linków" && git push)
